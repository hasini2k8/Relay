<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="A pharmacy counter with medicine boxes and a pill strip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2F3E8"/><stop offset="1" stop-color="#DDEEF0"/></linearGradient>
  </defs>
  <rect width="240" height="180" rx="24" fill="url(#bg)"/>
  <!-- shop sign -->
  <rect x="40" y="20" width="160" height="30" rx="10" fill="#1B6B45"/>
  <path d="M60 35h12M66 29v12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="82" y="30" width="96" height="10" rx="5" fill="#fff" opacity=".85"/>
  <!-- shelves -->
  <rect x="40" y="58" width="160" height="62" rx="8" fill="#fff"/>
  <path d="M40 89h160" stroke="#E8DFD3" stroke-width="3"/>
  <g>
    <rect x="52" y="64" width="22" height="20" rx="3" fill="#F2A33A"/>
    <rect x="78" y="68" width="18" height="16" rx="3" fill="#E5604D"/>
    <rect x="100" y="62" width="24" height="22" rx="3" fill="#2E8BA0"/>
    <rect x="128" y="66" width="20" height="18" rx="3" fill="#5A3A8C"/>
    <rect x="152" y="64" width="34" height="20" rx="3" fill="#F2A33A" opacity=".7"/>
    <rect x="52" y="95" width="30" height="20" rx="3" fill="#2E8BA0" opacity=".7"/>
    <rect x="86" y="97" width="18" height="18" rx="3" fill="#E5604D" opacity=".8"/>
    <rect x="108" y="95" width="26" height="20" rx="3" fill="#F2A33A"/>
    <rect x="138" y="99" width="20" height="16" rx="3" fill="#1B6B45" opacity=".7"/>
    <rect x="162" y="95" width="24" height="20" rx="3" fill="#5A3A8C" opacity=".7"/>
  </g>
  <!-- counter -->
  <rect x="24" y="124" width="192" height="40" rx="10" fill="#0E4D5C"/>
  <!-- pill strip -->
  <g transform="translate(70 128) rotate(-8)">
    <rect width="74" height="28" rx="8" fill="#fff"/>
    <g fill="#F2A33A"><ellipse cx="14" cy="14" rx="7" ry="5"/><ellipse cx="30" cy="14" rx="7" ry="5"/><ellipse cx="46" cy="14" rx="7" ry="5"/><ellipse cx="62" cy="14" rx="7" ry="5"/></g>
  </g>
  <!-- paid tick -->
  <circle cx="178" cy="138" r="16" fill="#fff"/>
  <path d="M170 138l6 6 10-11" stroke="#1B6B45" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
