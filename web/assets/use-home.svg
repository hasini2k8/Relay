    <g stroke="#E8DFD3" stroke-width="4" stroke-linecap="round"><path d="M10 16h36M10 28h26M10 40h32"/></g>
    <rect x="8" y="52" width="40" height="16" rx="8" fill="#E2F3E8"/>
    <text x="28" y="64" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#1B6B45">PAID</text>
  </g>
</svg>
