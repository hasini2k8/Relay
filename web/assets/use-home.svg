<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="A home with a light bulb and a bill marked paid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECE6F7"/><stop offset="1" stop-color="#DDEEF0"/></linearGradient>
  </defs>
  <rect width="240" height="180" rx="24" fill="url(#bg)"/>
  <path d="M40 92l60-50 60 50" fill="#5A3A8C"/>
  <rect x="52" y="88" width="96" height="70" rx="6" fill="#fff"/>
  <rect x="88" y="116" width="24" height="42" rx="4" fill="#0E4D5C"/>
  <rect x="62" y="102" width="18" height="16" rx="2" fill="#FDEBD0"/>
  <rect x="120" y="102" width="18" height="16" rx="2" fill="#FDEBD0"/>
  <!-- bulb -->
  <circle cx="100" cy="68" r="10" fill="#F2A33A"/>
  <g stroke="#F2A33A" stroke-width="3" stroke-linecap="round"><path d="M100 50v-6M84 56l-4-4M116 56l4-4"/></g>
  <!-- bill -->
