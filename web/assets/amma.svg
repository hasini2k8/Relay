<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="An elderly mother at home holding a phone, smiling, with a video call from her three children">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#F2A33A" stop-opacity=".45"/><stop offset="1" stop-color="#F2A33A" stop-opacity="0"/></radialGradient>
    <linearGradient id="saree" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E5604D"/><stop offset="1" stop-color="#B5452F"/></linearGradient>
  </defs>
  <circle cx="180" cy="150" r="150" fill="url(#glow)"/>
  <!-- window -->
  <rect x="34" y="40" width="90" height="110" rx="45" fill="#FFF8EC" stroke="#E8DFD3" stroke-width="3"/>
  <path d="M79 40v110M34 95h90" stroke="#E8DFD3" stroke-width="3"/>
  <circle cx="100" cy="70" r="12" fill="#F2A33A" opacity=".8"/>
